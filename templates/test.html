<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style_test.css">
    <title>API</title>
</head>
<body>
    <nav class="navbar" data-bs-theme="dark">
        <div class="container-fluid">
            <a href="{{ url_for('main.index') }}" class="navbar-brand">
                <i class="fa-solid fa-apple-whole fa-lg"></i>
                Healthy Food
            </a>
        </div>
    </nav>

    <main class="main">
        <section class="section">
            <div class="card">
                <img src="../static/img/prueba.webp" class="card-img-top" alt="imagen">
                <div class="card-body">
                    <h5 class="card-title">Card title</h5>
                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#ejemploModal">
                            Broccoli
                        </button>
                    </li>
                    <li class="list-group-item">
                        <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#ejemploModal">
                            Eggs
                        </button>
                    </li>
                    <li class="list-group-item">
                        <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#ejemploModal">
                            Carrots
                        </button>
                    </li>
                    <li class="list-group-item">
                        <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#ejemploModal">
                            Bread
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Modal 2 -->
            <div class="modal fade" id="ejemploModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button class="btn-header">Substitutes</button>
                        <div class="divider"></div>
                        <button class="btn-header">Substitutes</button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                    <ul>
                        <li>Brocoli</li>
                        <li>Carne de res</li>
                        <li>Huevos</li>
                        <li>Zanahoria</li>
                        <li>Pan</li>
                    </ul>
                    </div>
                    <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
