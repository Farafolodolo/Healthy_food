<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style_main.css">
    <title>Good Food</title>
</head>
<body>
    <nav class="navbar" data-bs-theme="dark">
        <div class="container-fluid">
            <a href="{{ url_for('main.index') }}" class="navbar-brand">
                <i class="fa-solid fa-apple-whole fa-lg"></i>
                Good Food
            </a>
            <form class="d-flex" role="search" id="searchForm">
                <input class="form-control me-2" 
                       id="search" 
                       type="search" 
                       placeholder="Search recipes..." 
                       aria-label="Search">
                <button class="btn search_btn" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <main class="container mt-4">
        <!-- Mensaje para resultados vacíos -->
        <div id="no-results" class="alert alert-warning text-center" style="display: none;">
            No recipes found. Try another search!
        </div>
        
        <!-- Contenedor dinámico de recetas -->
        <div id="recipes-container" class="row"></div>
        
        <!-- Loader para scroll infinito -->
        <div id="loader" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Corregido el enlace al archivo JavaScript -->
    <script src="{{ url_for('static', filename='js/call_api_recipes.js') }}"></script>
</body>
</html>
